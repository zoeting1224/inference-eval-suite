name: Import source archive

on:
  push:
    branches: [main]
    paths:
      - inference-eval-suite-source.tar.gz

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import source tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          tar -xzf inference-eval-suite-source.tar.gz
          rm -f inference-eval-suite-source.tar.gz .github/workflows/import-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import inference evaluation suite"
          git push origin HEAD:main
