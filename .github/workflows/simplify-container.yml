name: Simplify container script

on:
  push:
    branches: [main]
    paths:
      - inference-eval-container-simplify.tar.gz

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Apply container script update
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          tar -xzf inference-eval-container-simplify.tar.gz
          rm -f scripts/models/start_bf16.sh
          rm -f scripts/models/start_w4a8.sh
          rm -f scripts/models/stop_model.sh
          rm -f inference-eval-container-simplify.tar.gz .github/workflows/simplify-container.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Qwen3.8 container setup"
          git push origin HEAD:main
